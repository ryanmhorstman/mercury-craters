[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "craters"
version = "0.1.0"
description = "Crater detection on MESSENGER imagery of Mercury, compared against a hand-built catalog"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
